syntax = "proto3";

// Wire schema for wal-kv. Two services: Kv (client-facing) and Raft (internal
// consensus RPCs).
package waldkv;

// Client-facing key/value service.
service Kv {
  // Read the committed value for a key. Served by the leader so it's linearizable.
  rpc Get(GetRequest) returns (GetResponse);
  // Propose a write; returns once committed on a quorum.
  rpc Put(PutRequest) returns (PutResponse);
  // Propose a delete; returns once committed on a quorum.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  // If this node is not the leader, the id it believes is (0 if unknown), so the
  // client can retry against the right node.
  uint64 leader_hint = 3;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  // Log index the write committed at.
  uint64 index = 1;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  uint64 index = 1;
}

// Internal Raft service.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// One replicated log entry. `command` is the bincode encoding of the crate's
// `store::Command`, keeping the schema stable as commands evolve.
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_index = 3;
}
